        <dc:title>The Open Siddur Project Logo</dc:title>
        <dc:description>This logo expresses the mission statement and values of the Open Siddur Project: pluralism, diversity, liberty, history, and craft. The color wheel was created by Johannes Itten and used in his work Farbkeit (1961). The font is DejaVu Serif.</dc:description>
